name: Node.js CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Install Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # 151.0.7922.138 closes its DevTools session before the QUnit page
          # loads on GitHub-hosted runners. Keep CI on the last passing build
          # until a later Chrome version is deliberately validated.
          chrome-version: 151.0.7922.77
      - name: Verify Chrome
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'
      - run: npm run lint
      - name: Run tests
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test
