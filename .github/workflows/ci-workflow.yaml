name: Node.js CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Install Puppeteer-managed Chrome
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-${{ matrix.node-version }}
        run: |
          rm -rf "$PUPPETEER_CACHE_DIR"
          node node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome
          node -e "const fs = require('node:fs'); const puppeteer = require('puppeteer'); const path = puppeteer.executablePath(); fs.accessSync(path, fs.constants.X_OK); console.log(path)"
      - run: npm run lint
      - name: Run tests
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-${{ matrix.node-version }}
        run: npm test
